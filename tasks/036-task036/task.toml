# Harbor task configuration.
schema_version = "1.4"
artifacts = ["/app/final"]

[metadata]
name = "case-01-geometry"
description = "电荷局域态的 CO₂ 结构响应"

[task]
name = "compchemworld/case-01-geometry"
description = "电荷局域态的 CO₂ 结构响应"

[agent]
timeout_sec = 1800
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
