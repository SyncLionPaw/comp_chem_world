schema_version = "1.4"
artifacts = ["/app/final/results.json", "/app/final/quadratures.json"]


[task]
name = "compchemworld/case-01-elastic-collision"
description = "弹性碰撞算符与前向散射数值验证"

[agent]
timeout_sec = 1800
network_mode = "no-network"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 2048
network_mode = "no-network"

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[verifier.env]
TMPDIR = "/tmp"
