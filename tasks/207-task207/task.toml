# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/outputs"]

[task]
name = "compchemworld/case-01-copper-spin-state"
description = "Diagnose Cu(0), Cu(+1) and Cu(+2) ground and low-lying spin states with all-electron CCSD(T)/def2-QZVPP reference computations under frozen SCF and coupled-cluster convergence controls, select the minimum-energy state for each charge, derive IP0/IP1 and the QEq chi and J charge parameters, and report open-shell triplet-substitution countermodels with auditable reproducibility evidence."

[metadata]
name = "case-01-copper-spin-state"
description = "Diagnose Cu(0), Cu(+1) and Cu(+2) ground and low-lying spin states with all-electron CCSD(T)/def2-QZVPP reference computations under frozen SCF and coupled-cluster convergence controls, select the minimum-energy state for each charge, derive IP0/IP1 and the QEq chi and J charge parameters, and report open-shell triplet-substitution countermodels with auditable reproducibility evidence."
execution_class = "local"
difficulty = "hard"

