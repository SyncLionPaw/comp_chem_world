]

[task]
name = "compchemworld/case-05-mmgbsa-vs-bpmd-failure-attribution"
description = "Recompute the pose-level MM-GBSA versus OpenBPMD comparison from 200 poses across 40 systems: pooled Pearson and Spearman correlations with p-values, tie-aware top-1 success-rate bounds at the 2 A and 3 A cutoffs, within-system cluster statistics, and a bounded mechanistic attribution that maps the ranking failure to solvent, entropy and sampling error channels with constructive causal countermodels."

