# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/results.json", "/app/analysis.py", "/app/report.md", "/app/provenance.json", "/app/artifacts.json", "/app/scientific_assessment.json", "/app/systems", "/app/scan-frames.npz", "/app/scan-history.npz", "/app/constraint-settings.json"]

[task]
name = "compchemworld/case-03-relaxed-torsion-scan"
description = "Run complete constrained relaxed Sage torsion scans over the full 24-point, 15-degree grid in both directions for two QM-derived molecules, separating constraint error from unconverged remaining freedoms. Compare conditional MM and QM profiles per branch and report direction dependence without claiming unconstrained reaction barriers."

[metadata]
name = "case-03-relaxed-torsion-scan"
description = "Run complete constrained relaxed Sage torsion scans over the full 24-point, 15-degree grid in both directions for two QM-derived molecules, separating constraint error from unconverged remaining freedoms. Compare conditional MM and QM profiles per branch and report direction dependence without claiming unconstrained reaction barriers."
execution_class = "local"
difficulty = "hard"

[agent]
timeout_sec = 5400
network_mode = "public"

[verifier]
timeout_sec = 3600
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 4
memory_mb = 16384
build_timeout_sec = 3600
network_mode = "public"

[verifier.environment]
cpus = 4
memory_mb = 16384
build_timeout_sec = 3600
network_mode = "no-network"
