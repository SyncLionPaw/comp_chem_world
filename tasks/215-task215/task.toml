# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/protocol_response.json"]

[task]
name = "compchemworld/case-05-restraint-response"
description = "Compute the static restraint-Hamiltonian response and restart dependencies of the deposited nine-stage MD equilibration protocols for five PTP1B systems: derive restraint masks, stage controls and coordinate/velocity inheritance from the deposited topology, coordinates and namelists, evaluate prescribed translation, rotation and cell-vector perturbations as static diagnostics without MD, and report per-stage energies, net and maximum atom forces plus npt4-to-eqnpt restraint-energy deltas."

[metadata]
name = "case-05-restraint-response"
description = "Compute the static restraint-Hamiltonian response and restart dependencies of the deposited nine-stage MD equilibration protocols for five PTP1B systems: derive restraint masks, stage controls and coordinate/velocity inheritance from the deposited topology, coordinates and namelists, evaluate prescribed translation, rotation and cell-vector perturbations as static diagnostics without MD, and report per-stage energies, net and maximum atom forces plus npt4-to-eqnpt restraint-energy deltas."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 60
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"
