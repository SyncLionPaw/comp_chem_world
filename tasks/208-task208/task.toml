# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/outputs"]

[task]
name = "compchemworld/case-05-pore-potential-fidelity"
description = "Reconstruct full periodic Ewald pore electrostatic-potential fields for DDEC3, PQeq_GMP, EQeq_ox_exp and NO_Q over the fixed four-MOF panel, compare submitted gridded fields against evaluator-recomputed references under the frozen mask and gauge conventions, and score grid-resolution fidelity and pore-energy extrema against preregistered numerical budgets with controlled native replay."

[metadata]
name = "case-05-pore-potential-fidelity"
description = "Reconstruct full periodic Ewald pore electrostatic-potential fields for DDEC3, PQeq_GMP, EQeq_ox_exp and NO_Q over the fixed four-MOF panel, compare submitted gridded fields against evaluator-recomputed references under the frozen mask and gauge conventions, and score grid-resolution fidelity and pore-energy extrema against preregistered numerical budgets with controlled native replay."
execution_class = "local"
difficulty = "hard"

