# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/results"]

[task]
name = "compchemworld/case-05-partition"
description = "Analyze the supplied 108000-atom Ni/Al/Mo initial configuration to locate the ordered Ni3Al slab from FCC corner-sublattice Al occupation, classify gamma/gamma_prime/interface phases at the requested interface widths, and evaluate the static initial Mo partitioning K_snapshot together with the detailed-balance arithmetic of three recorded static swaps."

[metadata]
name = "case-05-partition"
description = "Analyze the supplied 108000-atom Ni/Al/Mo initial configuration to locate the ordered Ni3Al slab from FCC corner-sublattice Al occupation, classify gamma/gamma_prime/interface phases at the requested interface widths, and evaluate the static initial Mo partitioning K_snapshot together with the detailed-balance arithmetic of three recorded static swaps."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 1024
build_timeout_sec = 2400
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 1024
build_timeout_sec = 2400
network_mode = "no-network"
