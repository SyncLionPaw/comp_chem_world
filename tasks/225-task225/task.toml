# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = [
  "/app/ensemble_summary.json",
  "/app/convergence_analysis.json",
]

[task]
name = "compchemworld/case-03-multi-replica-ensemble-convergence"
description = "Assess convergence of a ten-replica OpenBPMD ensemble from per-replica CompScore traces: compute the replica-cluster variance change under the frozen bootstrap resampling protocol, classify per-replica variance stability, and report the ensemble summary and convergence diagnostics together with the explicit qualification that finite-trace statistics do not certify the underlying simulations as converged."

[metadata]
name = "case-03-multi-replica-ensemble-convergence"
description = "Assess convergence of a ten-replica OpenBPMD ensemble from per-replica CompScore traces: compute the replica-cluster variance change under the frozen bootstrap resampling protocol, classify per-replica variance stability, and report the ensemble summary and convergence diagnostics together with the explicit qualification that finite-trace statistics do not certify the underlying simulations as converged."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"
