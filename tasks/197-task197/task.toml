# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/audit.json", "/app/analysis.py", "/app/analysis.md", "/app/code"]

[task]
name = "compchemworld/case-05-mfi-snapshot-audit"
description = "Audit 100 stored same-geometry MFI DFT-labelled/NNP-labelled snapshot pairs: decompose energy and force errors across local chemical environments and displacement directions under declared cutoffs, report global, local and directional error statistics for all frames, and rank frames by three priority metrics. Deliver audit.json, an executable analysis and analysis.md that quantify retrospective inspection coverage only, with no new simulation, model inference or execution receipts."

[metadata]
name = "case-05-mfi-snapshot-audit"
description = "Audit 100 stored same-geometry MFI DFT-labelled/NNP-labelled snapshot pairs: decompose energy and force errors across local chemical environments and displacement directions under declared cutoffs, report global, local and directional error statistics for all frames, and rank frames by three priority metrics. Deliver audit.json, an executable analysis and analysis.md that quantify retrospective inspection coverage only, with no new simulation, model inference or execution receipts."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 900
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 2400
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 2400
network_mode = "no-network"
