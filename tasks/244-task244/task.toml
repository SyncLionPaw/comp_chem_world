# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/execution.json", "/app/profiles/", "/app/transport_observables.csv", "/app/transport_audit.json", "/app/spatial_interpretation.md", "/app/code/"]

[task]
name = "compchemworld/case-05-prescribed-flux-spatial-transport"
description = "Solve the source-defined seven-species GMPNP spatial transport model over the full domain at the prescribed potentials for zero and prescribed external CO fluxes, run the required mesh and 100-digit precision refinement ladders, and report the 42 contract observations with continuous conservation and operandwise sensitivity audits."

[metadata]
name = "case-05-prescribed-flux-spatial-transport"
description = "Solve the source-defined seven-species GMPNP spatial transport model over the full domain at the prescribed potentials for zero and prescribed external CO fluxes, run the required mesh and 100-digit precision refinement ladders, and report the 42 contract observations with continuous conservation and operandwise sensitivity audits."
execution_class = "local"
difficulty = "hard"

[agent]
timeout_sec = 7200
network_mode = "no-network"

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"
