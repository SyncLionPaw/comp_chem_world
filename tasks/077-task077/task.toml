title = "四种核相对 EOM-CCSD 的精度排序"
description = "Reproduce the kernel-accuracy ranking of the paper from the published per-molecule data: for PBE0/TZVP, ADMM-PBE0/TZVP+tzp, sTDA@PBE0/TZVP and sTDA@ADMM/TZVP+tzp first-singlet ES geometries and adiabatic excitation energies, compute the errors against the EOM-CCSD reference layer and verify that ADMM stays at the conventional-hybrid level while sTDA remains comparable with a systematic dihedral-angle overestimation."
