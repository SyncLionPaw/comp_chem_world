[task]
name = "compchemworld/case-04-coverage-fair-ranking"
description = "Compare charge-method rankings on the archived adsorption benchmark while correcting coverage confounding, using paired common-domain subsets, validity filters and bootstrap significance tests to separate ranking changes caused by coverage differences from genuine accuracy differences, and report family-sensitivity and coverage-cost analyses."

