# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/bep_grouped_validation.json", "/app/bep_transfer_report.md"]

[task]
name = "compchemworld/case-06-bep-grouped-validation"
description = "Validate Bell-Evans-Polanyi transfer on the supplied GMTKN55 BH76 barrier records using only standard-library Python: reproduce the paired grouped validation with forward/reverse OLS fits, repeated-transition-state grouped sensitivity, the covariance identity and TS-LOGO/pair-LOPO counterevidence, and deliver bep_grouped_validation.json plus bep_transfer_report.md under /app."

[metadata]
name = "case-06-bep-grouped-validation"
description = "Validate Bell-Evans-Polanyi transfer on the supplied GMTKN55 BH76 barrier records using only standard-library Python: reproduce the paired grouped validation with forward/reverse OLS fits, repeated-transition-state grouped sensitivity, the covariance identity and TS-LOGO/pair-LOPO counterevidence, and deliver bep_grouped_validation.json plus bep_transfer_report.md under /app."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[environment]
build_timeout_sec = 120
cpus = 1
memory_mb = 1024
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 120
cpus = 1
memory_mb = 1024
network_mode = "no-network"
