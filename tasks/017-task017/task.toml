schema_version = "1.4"
artifacts = ["/app/final"]

[task]
name = "compchemworld/bench03-case-04"
description = "Periodic microsolvated cluster extraction"

[metadata]
runtime_depends_on_root_archives = false

[agent]
timeout_sec = 7200
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 32768
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 4
memory_mb = 8192
storage_mb = 32768
build_timeout_sec = 1800
network_mode = "no-network"
