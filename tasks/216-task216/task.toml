# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/reaction_coordinate_report.json"]

[task]
name = "compchemworld/case-03-reaction-coordinate"
description = "Extract reaction-coordinate geometry for phosphocysteine hydrolysis from the deposited EVB stationary-point snapshots: assign reactant, transition-state and product stages with evidence for all twelve single-frame snapshots across four chimeras, and report S-P, P-O(water), O(water)-H and H-O(aspartate) distances to 0.01 A with coherent per-chimera monotonic progressions."

[metadata]
name = "case-03-reaction-coordinate"
description = "Extract reaction-coordinate geometry for phosphocysteine hydrolysis from the deposited EVB stationary-point snapshots: assign reactant, transition-state and product stages with evidence for all twelve single-frame snapshots across four chimeras, and report S-P, P-O(water), O(water)-H and H-O(aspartate) distances to 0.01 A with coherent per-chimera monotonic progressions."
