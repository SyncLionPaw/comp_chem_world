# Native Harbor task configuration; original Bench08 definition preserved in metadata.
schema_version = "1.4"
artifacts = [
  "/app/final",
]

[metadata]
name = "bench08/task-53-archived-silicon-static-mechanics"
description = "Independently calculate the smooth diamond-environment scalar and two frozen neural bias models on one fixed periodic 216-atom silicon snapshot; the candidate reports computed mechanics, and the trusted verifier separately compares them with preserved historical run0 records that are not candidate inputs."

[task]
name = "bench08/task-53-archived-silicon-static-mechanics"
description = "Independently calculate the smooth diamond-environment scalar and two frozen neural bias models on one fixed periodic 216-atom silicon snapshot; the candidate reports computed mechanics, and the trusted verifier separately compares them with preserved historical run0 records that are not candidate inputs."

[agent]
timeout_sec = 1800
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"
