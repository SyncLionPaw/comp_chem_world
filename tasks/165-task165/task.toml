schema_version = "1.4"
artifacts = ["/app/outputs", "/app/bench25-artifacts"]

[task]
name = "compchembench/bench25-case04"
description = "Low-budget butene dynamics reliability decision and short-trajectory validation."
authors = []
keywords = ["computational-chemistry", "nonadiabatic-dynamics"]

[metadata.compchembench]
handoff_version = "1.0"
case_id = "case-04"
readiness = "ROOT_CAPTURE_CONNECTED_SCIENCE_RECEIPT_PENDING"
compute_class = "local"
compute_execution = "local"
compute_network = "candidate-selected"
profile_id = "bench25-case04-agent-selected-v1"
resource_request_policy = { schema = "compchembench/bench25-agent-selected-resource-request/v1", max_wall_seconds = 300 }

[metadata.compchembench.requirements]
software = ["python", "pytorch", "schnetpack", "spainn", "sharc", "ase", "numpy"]

