[metadata.compchembench.verification]
implementation = "implemented"
verifier = "tests/verify.py"

[environment]
allow_internet = true
build_timeout_sec = 1800

[environment.env]
CCB_BENCH25_ROLE = "agent"
CCB_BENCH25_CASE = "case-04"
CCB_BENCH25_AGENT_USER = "researcher"
HOME = "/home/researcher"

[environment.healthcheck]
command = "if [ \"$CCB_BENCH25_ROLE\" = verifier ]; then exit 0; fi; test -S /run/bench25-capture/request.sock && test -s /run/bench25-capture/public-attempt.json && test -s /trusted/capture.key && test -s /trusted/case04-broker-health.json && test -x /opt/bench25/sharc/bin/sharc2.x && test -x /opt/bench25/sharc/bin/data_extractor.x && find /opt/bench25/sharc/pysharc -name 'sharc*.so' -type f -print -quit | grep -q ."
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 900.0
retries = 3

[agent]
timeout_sec = 86400.0
user = "researcher"
network_mode = "public"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
user = "root"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"

[verifier.environment.env]
CCB_BENCH25_ROLE = "verifier"
CCB_BENCH25_CASE = "case-04"
HOME = "/root"
APP = "/app"
TESTS = "/tests"
LOGS = "/logs/verifier"

[[verifier.collect]]
command = "/usr/bin/python3 -B -I /opt/bench25/bench25_capture.py collect"
service = "main"
timeout_sec = 120.0
user = "root"

[[metadata.compchembench.requirements.inputs]]
path = "inputs/pilot-baseline/weights/best_inference_model"
source_path = "environment/assets/pilot-baseline/weights/best_inference_model"
sha256 = "6365499f367fdba5d0299ec91632ddfd961fe695809dbed80f5e8ffbc85bc31c"

