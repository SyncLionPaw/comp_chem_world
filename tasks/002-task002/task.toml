# Harbor task config migrated from the archived Bench01 definition.
schema_version = "1.4"
artifacts = ["/app/final"]

[metadata]
name = "case-02-mechanistic-feature-gain"
description = "Assess on public released data whether a model using transition-state information improves experimental activation-barrier prediction over a declared direct computed barrier, train-only linear correction, training mean and a model without transition-state information. Use the frozen 354/89 split for the preferred scored comparison, declare and defend the protocol, and disclose that labels are public rather than blind."

[task]
