# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/system.prmtop", "/app/system.inpcrd", "/app/protonation_audit.json"]

[task]
name = "compchemworld/case-01-system-preparation"
description = "Prepare the solvated PTP1B phosphocysteine hydrolysis intermediate with AmberTools: load the supplied CSP template and missing-term frcmod, resolve every titratable state including explicit HID/HIE/HIP and a deprotonated catalytic aspartate, solvate in a periodic octahedral TIP3P box with at least 10 A clearance and Na+/Cl- neutralisation, and deliver a LEaP/CPPTRAJ-readable topology, coordinates and a per-residue protonation audit."

[metadata]
name = "case-01-system-preparation"
description = "Prepare the solvated PTP1B phosphocysteine hydrolysis intermediate with AmberTools: load the supplied CSP template and missing-term frcmod, resolve every titratable state including explicit HID/HIE/HIP and a deprotonated catalytic aspartate, solvate in a periodic octahedral TIP3P box with at least 10 A clearance and Na+/Cl- neutralisation, and deliver a LEaP/CPPTRAJ-readable topology, coordinates and a per-residue protonation audit."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 3600
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 3600
network_mode = "no-network"
