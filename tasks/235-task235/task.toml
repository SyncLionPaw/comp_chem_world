# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/network_topology_metrics.json", "/app/hub_analysis_report.md", "/app/scientific_certificate.json"]

[task]
name = "compchemworld/case-02-reaction-network-hub-centrality"
description = "Analyse the complete Rad-6 reaction network from the supplied reactions CSV and molecule metadata: recompute the simple undirected species projection, degree hubs with source participation evidence, sampled betweenness with uncertainty, the descriptive degree-tail fit and the full reaction-energy closure against the AE ledger, and deliver network_topology_metrics.json, hub_analysis_report.md and a source-bound scientific certificate under /app."

[metadata]
name = "case-02-reaction-network-hub-centrality"
description = "Analyse the complete Rad-6 reaction network from the supplied reactions CSV and molecule metadata: recompute the simple undirected species projection, degree hubs with source participation evidence, sampled betweenness with uncertainty, the descriptive degree-tail fit and the full reaction-energy closure against the AE ledger, and deliver network_topology_metrics.json, hub_analysis_report.md and a source-bound scientific certificate under /app."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[environment]
build_timeout_sec = 120
cpus = 4
memory_mb = 8192
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 120
cpus = 4
memory_mb = 8192
network_mode = "no-network"
