[task]
name = "compchemworld/case-06-torsion-parameter-refit"
description = "Refit a small set of existing Sage Proper torsion parameters against training QM energy differences with ridge regularization under a strict objective-call budget, then validate against protected QM angles and an independent molecule. Report training gains, protected degradation and applicability limits with evidence-backed controls rather than guaranteed improvement."

