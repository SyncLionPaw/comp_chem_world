description = "Build periodic Sage ethanol liquid boxes at 128 and 256 molecules and run independent NPT replicas at 298.15 K and 1 bar under a fixed PME protocol, with evaluator-owned native integration capture. Establish statistical support for the predicted density through equilibration detection, autocorrelation-aware uncertainty, replica agreement and finite-size comparison."

