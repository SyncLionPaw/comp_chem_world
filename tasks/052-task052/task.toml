# Native Harbor task configuration; original Bench08 definition preserved in metadata.
schema_version = "1.4"
artifacts = [
  "/app/submission.py",
]

[metadata]
name = "bench08/task-52-archived-chain-mc-kernel"
description = "Implement a periodic six-angle forward/backpropagation API, a target/flat Metropolis transition kernel, and expectation/MCSE analysis over the supplied fixed archived chains."

[task]
name = "bench08/task-52-archived-chain-mc-kernel"
description = "Implement a periodic six-angle forward/backpropagation API, a target/flat Metropolis transition kernel, and expectation/MCSE analysis over the supplied fixed archived chains."

[agent]
timeout_sec = 1800
network_mode = "no-network"

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 896
build_timeout_sec = 1800
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 896
build_timeout_sec = 1800
network_mode = "no-network"
