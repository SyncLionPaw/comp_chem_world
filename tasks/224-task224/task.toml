# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = [
  "/app/protocol_config.json",
  "/app/hill_height_decision.md",
  "/app/hill_height_evidence.json",
]

[task]
name = "compchemworld/case-02-metadynamics-protocol-setup"
description = "Configure the frozen OpenBPMD biasing protocol for a solvated protein-ligand system: derive anchor and ligand-heavy-atom selections from the supplied Amber topology, document the RMSD collective variable, hill deposition schedule and periodic-boundary workaround, run CPU-side geometry smoke checks of the OpenMM force construction, and decide between the 0.30 and 0.05 kcal/mol hill heights from the supplied OpenBPMD supporting-information ranking tables with paired statistics and bounded countermodels."

[metadata]
name = "case-02-metadynamics-protocol-setup"
description = "Configure the frozen OpenBPMD biasing protocol for a solvated protein-ligand system: derive anchor and ligand-heavy-atom selections from the supplied Amber topology, document the RMSD collective variable, hill deposition schedule and periodic-boundary workaround, run CPU-side geometry smoke checks of the OpenMM force construction, and decide between the 0.30 and 0.05 kcal/mol hill heights from the supplied OpenBPMD supporting-information ranking tables with paired statistics and bounded countermodels."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 600
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
