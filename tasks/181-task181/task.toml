schema_version = "1.4"
artifacts = ["/app/runs/task181-mlmd-v2"]

[task]
name = "compchemworld/bench28-task-181"
description = "Run the existing water committee on fresh MLMD trajectories"

[metadata]
task_number = 181
case_id = "water-committee-training"
execution_class = "remote"
assessment_status = "Automatic verifier score; runner execution provenance remains unauthenticated."

[agent]
timeout_sec = 86400
network_mode = "public"

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
network_mode = "no-network"

[environment]
workdir = "/app"
network_mode = "public"
build_timeout_sec = 1800

[[verifier.collect]]
command = "python3 /usr/local/bin/bench28-remote-lifecycle.py"
service = "main"
timeout_sec = 600
user = "root"
