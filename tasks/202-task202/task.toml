# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/reweighting.npz", "/app/results.json", "/app/analysis.py"]

[task]
name = "compchemworld/case-05-gas-reweighting-diagnostics"
description = "Evaluate the sealed six-particle gas Hamiltonian over all eight lambda states for two 320-frame replicas, solve the finite-data MBAR self-consistency equations, and report gauge-fixed f vectors, state overlaps and effective sample sizes under both sample and state gauge transformations. Explain why these conditional reweighting diagnostics cannot establish hydration free energies, equilibrium or temporal independence."

[metadata]
name = "case-05-gas-reweighting-diagnostics"
description = "Evaluate the sealed six-particle gas Hamiltonian over all eight lambda states for two 320-frame replicas, solve the finite-data MBAR self-consistency equations, and report gauge-fixed f vectors, state overlaps and effective sample sizes under both sample and state gauge transformations. Explain why these conditional reweighting diagnostics cannot establish hydration free energies, equilibrium or temporal independence."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "public"

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 2048
build_timeout_sec = 3600
network_mode = "public"

[verifier.environment]
cpus = 1
memory_mb = 2048
build_timeout_sec = 3600
network_mode = "no-network"
