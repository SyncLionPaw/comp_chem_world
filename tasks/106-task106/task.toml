timeout_sec = 3
start_period_sec = 120
start_interval_sec = 2
retries = 60

[environment.env]
CCB_BENCH16_RUN_MODE = "normal"
HOME = "/home/researcher"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
