# Harbor task configuration.
schema_version = "1.4"
artifacts = ["/app/final"]

[metadata]
name = "case-04-outer-sphere-budgeted"
description = "有限预算下的外球抽样与 Marcus 推断"

[task]
name = "compchemworld/case-04-outer-sphere-budgeted"
description = "有限预算下的外球抽样与 Marcus 推断"

