# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/charge_response.csv", "/app/correction_ledger.json", "/app/charge_response_analysis.md"]

[task]
name = "compchemworld/case-02-charge-energy-response"
description = "Reconstruct the sixteen quadratic charge-energy models for Au adsorbates at all six supplied charges, compute energies and derivatives at every grid point, and audit the six reference-state corrections with source-located inclusion status without inventing total free energies."

[metadata]
name = "case-02-charge-energy-response"
description = "Reconstruct the sixteen quadratic charge-energy models for Au adsorbates at all six supplied charges, compute energies and derivatives at every grid point, and audit the six reference-state corrections with source-located inclusion status without inventing total free energies."
execution_class = "local"
difficulty = "easy"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 1024
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 1024
build_timeout_sec = 1800
network_mode = "no-network"
