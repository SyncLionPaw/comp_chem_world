# Harbor task configuration.
schema_version = "1.4"
artifacts = ["/app/final"]

[metadata]
name = "case-05-inner-sphere-budgeted"
description = "稀疏静态 DFT 证据下的局部响应与科学决策"

[task]
name = "compchemworld/case-05-inner-sphere-budgeted"
description = "稀疏静态 DFT 证据下的局部响应与科学决策"

[agent]
timeout_sec = 1800
network_mode = "no-network"

[verifier]
timeout_sec = 600
