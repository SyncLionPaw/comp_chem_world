# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/kinetic_model.json", "/app/steady_states.csv", "/app/drc_perturbations.csv", "/app/kinetics_diagnosis.md"]

[task]
name = "compchemworld/case-03-fixed-activity-microkinetics"
description = "Solve the source-defined four-step fixed-activity CHE-Frumkin microkinetic model along the prescribed charging path, report steady-state coverages, rates and currents at every stencil node, and compute degree-of-rate-control perturbations and Tafel slopes with independently recomputed numerical bounds."

[metadata]
name = "case-03-fixed-activity-microkinetics"
description = "Solve the source-defined four-step fixed-activity CHE-Frumkin microkinetic model along the prescribed charging path, report steady-state coverages, rates and currents at every stencil node, and compute degree-of-rate-control perturbations and Tafel slopes with independently recomputed numerical bounds."
execution_class = "local"
difficulty = "hard"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 2
memory_mb = 8192
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800
network_mode = "no-network"
