# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/counterexamples.npz", "/app/isotope_analysis.json", "/app/identifiability.md"]

[task]
name = "compchemworld/case-04-vibrational-isotope-identifiability"
description = "Construct numerical harmonic counterexamples in the supplied frozen model family to test whether an H vibrational spectrum together with atomic masses uniquely determines the H-to-D zero-point-energy shift, reporting generalized-eigenproblem reconstructions, numerical budgets and the resolved uniform-sqrt(2) shortcut error."

[metadata]
name = "case-04-vibrational-isotope-identifiability"
description = "Construct numerical harmonic counterexamples in the supplied frozen model family to test whether an H vibrational spectrum together with atomic masses uniquely determines the H-to-D zero-point-energy shift, reporting generalized-eigenproblem reconstructions, numerical budgets and the resolved uniform-sqrt(2) shortcut error."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 3600
network_mode = "no-network"

[verifier]
timeout_sec = 300
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 1024
build_timeout_sec = 1800
network_mode = "no-network"

[verifier.environment]
cpus = 1
memory_mb = 1024
build_timeout_sec = 1800
network_mode = "no-network"
