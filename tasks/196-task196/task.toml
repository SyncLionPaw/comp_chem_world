# Harbor 0.25.0 task configuration.
schema_version = "1.4"
artifacts = ["/app/optimized.traj", "/app/properties.csv", "/app/convergence.json", "/app/native", "/app/analysis.md"]

[task]
name = "compchemworld/case-04-nnp-cell-optimization"
description = "Optimize the atomic positions and unit cells of eight silica zeolite frameworks to zero external pressure with the designated SiAlOH1 neural-network potential, record stopping conditions together with strictly tightened continuations, and verify periodic image-edge topology for both final and tightened structures. Report per-Si quartz-gauged relative energies, densities, mean bond lengths and lattice lengths with native optimization histories and independent derivative checks."

[metadata]
name = "case-04-nnp-cell-optimization"
description = "Optimize the atomic positions and unit cells of eight silica zeolite frameworks to zero external pressure with the designated SiAlOH1 neural-network potential, record stopping conditions together with strictly tightened continuations, and verify periodic image-edge topology for both final and tightened structures. Report per-Si quartz-gauged relative energies, densities, mean bond lengths and lattice lengths with native optimization histories and independent derivative checks."
execution_class = "local"
difficulty = "medium"

[agent]
timeout_sec = 259200
network_mode = "public"

[verifier]
timeout_sec = 10800
environment_mode = "separate"
network_mode = "no-network"

