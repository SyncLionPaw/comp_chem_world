# Claude Code + DeepSeek official API (Anthropic-compatible surface).
# Compose with a task config, e.g.:
#   uv run harbor run -c configs/local.yaml -c configs/agent-deepseek.yaml \
#     --env-file .env -y
#
# Credentials: ANTHROPIC_API_KEY + ANTHROPIC_BASE_URL in .env
#   ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic
# Model on official API is `deepseek-chat` (not litellm alias deepseek-flash).

agents:
  - name: claude-code
    model_name: deepseek-chat
    model_api_key_name: ANTHROPIC_API_KEY
    kwargs:
      version: "2.1.317"
