# Default agent. Compose with a task config, e.g.:
#   uv run harbor run -c configs/local.yaml -c configs/agent.yaml --env-file .env -y
#
# Switch model by editing model_name here, or for one run:
#   -c configs/local.yaml -c configs/agents.clear.yaml \
#   -a claude-code -m <provider/model> --ak version=2.1.317 \
#   --api-key-name ANTHROPIC_API_KEY --env-file .env -y
#
# Credentials / endpoint: ANTHROPIC_API_KEY + ANTHROPIC_BASE_URL in .env
# (or override with --base-url / --api-key-name).

agents:
  - name: claude-code
    model_name: deepseek/deepseek-flash
    model_api_key_name: ANTHROPIC_API_KEY
    kwargs:
      version: "2.1.317"
